[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabula"
version = "0.1.0"
description = "Symbolic MIDI to 6-string guitar tablature with a reduced T5 encoder-decoder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "torch==2.5.1",
    "transformers==4.57.6",
    "accelerate==1.15.0",
]

[project.optional-dependencies]
data = ["pretty_midi>=0.2.10", "mido>=1.3", "jams>=0.3.4"]
dev = ["pytest>=8"]

[project.scripts]
midi2tab = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]
